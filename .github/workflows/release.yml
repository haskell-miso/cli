# Build miso for each platform with nix, and attach the tarballs (and their
# sha256) to the GitHub release of a v* tag.  install.sh downloads them.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux,   runner: ubuntu-latest }
          - { system: aarch64-linux,  runner: ubuntu-24.04-arm }
          # no x86_64-darwin: the nixpkgs of the miso flake (26.11) dropped it
          - { system: aarch64-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build -L .#tarball
      - name: Smoke test
        run: |
          mkdir smoke && tar -C smoke -xzf result/miso-${{ matrix.system }}.tar.gz
          export MISO_HOME=$PWD/smoke-home PATH=$PWD/smoke/miso-${{ matrix.system }}/bin:$PATH
          miso version
          miso new hello
          cd hello
          sed -i.bak 's/^target: browser/target: native/' miso.yml
          printf 'module Main where\nmain :: IO ()\nmain = putStrLn "hello"\n' > app/Main.hs
          miso run | tail -1 | grep -qx hello
      - name: Check static linking
        if: runner.os == 'Linux'
        run: |
          file smoke/miso-${{ matrix.system }}/bin/miso
          file smoke/miso-${{ matrix.system }}/bin/miso | grep -q 'statically linked'
      - uses: actions/upload-artifact@v4
        with:
          name: miso-${{ matrix.system }}
          path: result/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
