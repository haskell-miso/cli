# Build miso for each platform, and attach the tarballs (and their sha256)
# to the GitHub release of a v* tag.  install.sh downloads them.
#
# Linux and Apple Silicon build with nix (flake.nix).  The miso flake's
# nixpkgs dropped Intel macOS, and nix does not run on Windows, so those
# build with scripts/build-release.sh, which does the same without nix.
name: release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { system: x86_64-linux,   runner: ubuntu-latest }
          - { system: aarch64-linux,  runner: ubuntu-24.04-arm }
          - { system: aarch64-darwin, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Build
        run: nix build -L .#tarball
      - name: Smoke test
        run: scripts/smoke-test.sh result/miso-${{ matrix.system }}.tar.gz
      - name: Check static linking
        if: runner.os == 'Linux'
        run: |
          tar -C "$RUNNER_TEMP" -xzf result/miso-${{ matrix.system }}.tar.gz
          file "$RUNNER_TEMP/miso-${{ matrix.system }}/bin/miso"
          file "$RUNNER_TEMP/miso-${{ matrix.system }}/bin/miso" | grep -q 'statically linked'
      - uses: actions/upload-artifact@v5
        with:
          name: miso-${{ matrix.system }}
          path: result/*

  build-intel-mac:
    # GitHub retired the macos-13 image (jobs wait for it forever);
    # macos-15-intel is the free Intel runner.
    runs-on: macos-15-intel
    env:
      # run on macOS 13 and later, not only on the runner's macOS 15
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: scripts/build-release.sh x86_64-darwin
      - name: Smoke test
        run: scripts/smoke-test.sh build/out/miso-x86_64-darwin.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: miso-x86_64-darwin
          path: build/out/*

  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5
      - uses: msys2/setup-msys2@v2
        with:
          # MSYS2's POSIX environment: MicroHs builds with its unix
          # configuration, and miso needs MSYS2 (msys-2.0.dll) to run
          msystem: MSYS
          install: >-
            gcc
            make
            git
            tar
            curl
      - name: Build
        run: scripts/build-release.sh x86_64-windows
      - name: Smoke test
        run: scripts/smoke-test.sh build/out/miso-x86_64-windows.tar.gz
      - uses: actions/upload-artifact@v5
        with:
          name: miso-x86_64-windows
          path: build/out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-intel-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
