# Temporary: what miso can install.  Runs on pushes to probe-installs only.
name: probe
on:
  push:
    branches: [probe-installs]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#tarball && cp result/miso-x86_64-linux.tar.gz miso.tar.gz
      - uses: actions/upload-artifact@v5
        with: { name: tool, path: miso.tar.gz }

  safe:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with: { name: tool }
      - name: safe
        run: |
          probe/safe.sh miso.tar.gz | tee out.txt
          r=$(grep '^PROBE' out.txt); r=${r//'%'/'%25'}; r=${r//$'\r'/}; r=${r//$'\n'/'%0A'}
          echo "::notice title=probe safe::$r"

  projects:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v5
        with: { name: tool }
      - name: projects
        run: |
          rev=$(jq -r '.nodes[.nodes.miso.inputs.nixpkgs].locked.rev' flake.lock)
          nix shell "github:NixOS/nixpkgs/$rev#emscripten" --command probe/projects.sh miso.tar.gz | tee out.txt
          # in parts of about 3000 characters: GitHub cuts an annotation at about 4 KB
          split -C 3000 out.txt part.
          for f in part.*; do
            r=$(cat "$f"); r=${r//'%'/'%25'}; r=${r//$'\r'/}; r=${r//$'\n'/'%0A'}
            echo "::notice title=probe projects $f::$r"
          done
